<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevHub</title>
    <script>
      // Apply the last-used theme before the first paint. React only knows the
      // theme after an IPC round-trip to the backend, which used to leave a
      // white frame (and a light->dark flip) on every launch.
      (function () {
        try {
          var theme = localStorage.getItem("devhub:theme");
          var dark =
            theme === "dark" ||
            ((!theme || theme === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* storage may be unavailable; fall back to the light default */
        }
      })();
    </script>
    <style>
      /* Matches --bg in src/index.css so the window never shows a bare white frame. */
      html {
        background: #ffffff;
      }
      html.dark {
        background: #0f172a;
      }
      /* Boot loader: painted from the raw HTML, before any JS or CSS bundle
         has loaded, so the window is never an empty rectangle. App removes it
         once React has mounted. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #ffffff;
        color: #64748b;
        font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei",
          sans-serif;
        user-select: none;
      }
      html.dark #boot {
        background: #0f172a;
        color: #94a3b8;
      }
      #boot .ring {
        width: 18px;
        height: 18px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .ring {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><span class="ring"></span><span>正在启动...</span></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
